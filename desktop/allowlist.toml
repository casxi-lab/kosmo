# The allowlist of the workspace desktop: one entry for each crates.io
# package of desktop/Cargo.lock that `cargo metadata --filter-platform`
# resolves for one of the targets of desktop in layout.toml, and none for a
# package that only other platforms use. The workspace has no crates.io
# package yet. The deps step of `cargo xtask check` compares the entries
# with what Cargo resolves and, when they differ, prints the entries to
# add, replace or remove. CONTRIBUTING.md describes the fields.
