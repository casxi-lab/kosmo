# Clippy configuration for every workspace of the repository: Clippy reads
# the nearest clippy.toml at or above a crate's directory, and the layout
# step allows no other. Tests may unwrap, expect and panic; the workspaces
# deny these in all other code.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# The methods and functions that deterministic code does not call, which
# the product workspaces deny with the lint `disallowed_methods`. The
# entries are the output of the command in "The determinism lints" of
# CONTRIBUTING.md, run with toolchain 1.99.0 and libm 0.2.16: the methods of
# `f32` and `f64` whose documentation states an unspecified precision, a
# non-deterministic result or an algebraic operation, and every function of
# libm, which only the wrapper module det_math of kosmo-render calls.
disallowed-methods = [
    { path = "f32::powi", reason = "its precision is unspecified and differs between hosts; deterministic code calls det_math in kosmo-render" },
    { path = "f32::powf", reason = "its precision is unspecified and differs between hosts; deterministic code calls det_math in kosmo-render" },
