# The types that deterministic code does not use, also through
# re-exports, which the product workspaces deny with the lint
# `disallowed_types`: the hash containers of the standard library and their
# default hasher, whose seed changes from run to run, and the helper type
# of libm, through which its functions can be called too.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "its default hasher is seeded differently in every run; deterministic code uses an ordered map" },
    { path = "std::collections::HashSet", reason = "its default hasher is seeded differently in every run; deterministic code uses an ordered set" },
    { path = "std::hash::RandomState", reason = "it is seeded differently in every run" },
    { path = "libm::Libm", reason = "deterministic code calls libm only through det_math in kosmo-render" },
]
