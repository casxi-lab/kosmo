[package]
name = "kosmo-ui"
description = "The framework core: the control tree with its passes, the round function and its shell, result slots, timers, dispatch, focus checks, key bindings, hit testing and the drawing pass"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# The call probe of the single-round entry, for tests of call relations.
# Off by default; only the command line turns it on, as
# `--features kosmo-ui/call-probes`.
call-probes = ["dep:kosmo-testkit"]

[dependencies]
kosmo-math-model.workspace = true
kosmo-platform.workspace = true
kosmo-render.workspace = true
kosmo-testkit = { workspace = true, optional = true }
kosmo-types.workspace = true

[lints]
workspace = true
