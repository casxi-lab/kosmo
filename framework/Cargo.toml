# The framework workspace: foundations and models, the framework core,
# adapters and backends, controls, composition and the SDK facade. It
# depends on the display workspace only through its export crates.
[workspace]
resolver = "3"
members = [
    "backend-headless",
    "jobs",
    "math-kalyx",
    "math-model",
    "platform",
    "render",
    "scratchpad",
    "sdk",
    "testkit",
    "text",
    "ui",
]

[workspace.package]
version = "0.1.0-dev.1"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
accesskit = { version = "=0.25.2", default-features = false }
kalyx = "=0.1.0"
kosmo-jobs = { path = "jobs", version = "=0.1.0-dev.1" }
kosmo-math-kalyx = { path = "math-kalyx", version = "=0.1.0-dev.1" }
kosmo-math-model = { path = "math-model", version = "=0.1.0-dev.1" }
kosmo-platform = { path = "platform", version = "=0.1.0-dev.1" }
kosmo-render = { path = "render", version = "=0.1.0-dev.1" }
kosmo-scratchpad = { path = "scratchpad", version = "=0.1.0-dev.1" }
kosmo-testkit = { path = "testkit", version = "=0.1.0-dev.1" }
kosmo-text = { path = "text", version = "=0.1.0-dev.1" }
kosmo-types = { path = "../display/types", version = "=0.1.0-dev.1" }
kosmo-ui = { path = "ui", version = "=0.1.0-dev.1" }
libm = { version = "=0.2.16", default-features = false }
parley = { version = "=0.13.0", default-features = false, features = ["libm"] }
sha2 = { version = "=0.11.1", default-features = false }
skrifa = { version = "=0.49.0", default-features = false, features = ["libm"] }
vello_cpu = { version = "=0.4.0", default-features = false, features = ["libm", "u8_pipeline"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# Code outside tests never unwraps, panics or leaves a placeholder, and an
# `#[allow]` states its reason. The root `clippy.toml` lets tests unwrap,
# expect and panic.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
allow_attributes_without_reason = "deny"
# The methods and types that the root `clippy.toml` lists for
# deterministic code are denied in every crate of the workspace.
disallowed_methods = "deny"
disallowed_types = "deny"

[profile.release]
overflow-checks = true
