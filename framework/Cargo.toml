# The framework workspace: foundations and models, the framework core,
# adapters and backends, controls, composition and the SDK facade. It
# depends on the display workspace only through its export crates.
[workspace]
resolver = "3"
members = ["kosmo-jobs", "kosmo-math-kalyx", "kosmo-math-model"]

[workspace.package]
version = "0.1.0-dev.1"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
kalyx = "=0.1.0"
kosmo-jobs = { path = "kosmo-jobs", version = "=0.1.0-dev.1" }
kosmo-math-model = { path = "kosmo-math-model", version = "=0.1.0-dev.1" }

[workspace.lints.rust]
unsafe_code = "forbid"

# Code outside tests never unwraps, panics or leaves a placeholder, and an
# `#[allow]` states its reason. The root `clippy.toml` lets tests unwrap,
# expect and panic.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
allow_attributes_without_reason = "deny"

[profile.release]
overflow-checks = true
