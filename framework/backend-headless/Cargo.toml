[package]
name = "kosmo-backend-headless"
description = "The headless backend of the platform interface: no threads, never blocking, with a virtual clock that only its driver advances"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# The test hooks of the platform interface, implemented for this backend.
# Off by default; only test builds turn it on.
test-hooks = ["kosmo-platform/test-hooks"]
# The test of call relations, which runs a script and checks the call
# probes of the script runner and the single-round entry. Off by default;
# only the command line turns it on, together with the test hooks, as
# `--features test-hooks,call-probes`.
call-probes = ["kosmo-testkit/call-probes", "kosmo-ui/call-probes"]

[dependencies]
kosmo-platform.workspace = true
kosmo-types.workspace = true

[dev-dependencies]
kosmo-jobs.workspace = true
kosmo-math-model.workspace = true
kosmo-render.workspace = true
kosmo-testkit.workspace = true
kosmo-text.workspace = true
kosmo-ui.workspace = true

[lints]
workspace = true
