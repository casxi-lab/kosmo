# The allowlist of the workspace framework: one entry for each crates.io
# package of framework/Cargo.lock that `cargo metadata --filter-platform`
# resolves for one of the targets of framework in layout.toml, and none for
# a package that only other platforms use, followed by the license
# exceptions of the workspace.
# The deps step of `cargo xtask check` compares the entries with what Cargo
# resolves and, when they differ, prints the entries to add, replace or
# remove; it also checks the license and the build script of each package
# against the rules and the exceptions. CONTRIBUTING.md describes the fields
# and the rules.

[[package]]
name = "autocfg"
version = "1.5.1"
source = "crates.io"
license = "Apache-2.0 OR MIT"
build-script = false
features = []
crates = ["kosmo-math-kalyx"]

[[package]]
name = "kalyx"
version = "0.1.0"
source = "crates.io"
license = "MIT"
build-script = false
features = []
crates = ["kosmo-math-kalyx"]

[[package]]
name = "num-bigint"
version = "0.4.8"
source = "crates.io"
license = "MIT OR Apache-2.0"
build-script = false
features = ["default", "std"]
crates = ["kosmo-math-kalyx"]

[[package]]
name = "num-integer"
version = "0.1.47"
source = "crates.io"
license = "MIT OR Apache-2.0"
build-script = false
features = ["i128", "std"]
crates = ["kosmo-math-kalyx"]

[[package]]
name = "num-rational"
version = "0.4.2"
source = "crates.io"
license = "MIT OR Apache-2.0"
build-script = false
features = ["default", "num-bigint", "std"]
crates = ["kosmo-math-kalyx"]

[[package]]
name = "num-traits"
version = "0.2.19"
source = "crates.io"
license = "MIT OR Apache-2.0"
build-script = true
features = ["default", "i128", "std"]
crates = ["kosmo-math-kalyx"]
