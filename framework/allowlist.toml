# The allowlist of the workspace framework: one entry for each crates.io
# package of framework/Cargo.lock that `cargo metadata --filter-platform`
# resolves for one of the targets of framework in layout.toml, and none for
# a package that only other platforms use, followed by the license
# exceptions of the workspace.
# The deps step of `cargo xtask check` compares the entries with what Cargo
# resolves and, when they differ, prints the entries to add, replace or
# remove; it also checks the license and the build script of each package
# against the rules and the exceptions. CONTRIBUTING.md describes the fields
# and the rules.

