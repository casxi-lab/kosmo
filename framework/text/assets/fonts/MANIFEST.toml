# The asset manifest of kosmo-text: the two fonts that kosmo bundles, sorted
# by `file`. For each font it records the path of the file in this
# directory, its size in bytes and SHA-256 digest, where it was taken from,
# the commit of the font's own repository that google/fonts records for it,
# its version and role, its license and the path and SHA-256 digest of its
# license file, which lies in the same directory as the font. The fonts and
# their license files are unmodified copies of the files of the same names
# in google/fonts at the commit of `source`. The goldens step of
# `cargo xtask check` checks that this directory holds, besides this file,
# exactly the files listed here, each with its digest, as the font assets
# in CONTRIBUTING.md describe.

