# The allowlist of the tool workspace xtask: one entry for each crates.io
# package of xtask/Cargo.lock that `cargo metadata --filter-platform`
# resolves for one of the targets of xtask in layout.toml, and none for a
# package that only other platforms use, followed by the license exceptions
# of the workspace. The deps step of `cargo xtask check` compares the
# entries with what Cargo resolves and, when they differ, prints the entries
# to add, replace or remove; it also checks the license and the build script
# of each package against the rules and the exceptions. CONTRIBUTING.md
# describes the fields and the rules.

[[package]]
name = "arraydeque"
version = "0.5.1"
source = "crates.io"
license = "MIT/Apache-2.0"
build-script = false
features = ["default", "std"]
crates = ["xtask"]

