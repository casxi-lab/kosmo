[package]
name = "xtask"
version = "0.0.0"
description = "Repository tasks for kosmo, run as `cargo xtask`"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.99"

# xtask is a workspace of its own, apart from the kosmo program.
[workspace]

[dependencies]
# The token type under `syn`: the layout step scans the tokens of Rust
# source files and reports the line of each literal path and name it finds,
# which the span locations give. The step runs outside a procedural macro,
# so the procedural-macro support of the default feature is left out.
proc-macro2 = { version = "=1.0.107", default-features = false, features = ["span-locations"] }
# The layout step reads `layout.toml` into types that derive `Deserialize`,
# and the deps step prints allow entries and allowlist entries from types
# that derive `Serialize`; only the derive macros and the allocation support
# for strings, vectors and maps are needed.
serde = { version = "=1.0.229", default-features = false, features = ["alloc", "derive"] }
# The receipt of `cargo xtask check` keeps its fields in the order in which
# they are written, so the insertion-ordered map of the `preserve_order`
# feature is used. The receipt is written to a string, and its tests read it
# back from one; the deps step reads the output of `cargo metadata` from a
# string into types that derive `Deserialize`. So the standard-library
# support of the default feature is left out.
serde_json = { version = "=1.0.154", default-features = false, features = ["preserve_order"] }
# The layout step reads the inner attributes of the library root of each
# pure-core crate with the parser of the full syntax. Printing, the `Clone`
# implementations and the procedural-macro support of the default features
# are not used.
syn = { version = "=3.0.9", default-features = false, features = ["full", "parsing"] }
# The layout step parses `layout.toml` into its types and the Cargo
# manifests and the Cargo configuration into tables, and the deps step reads
# the lock files and the allowlists. When the allow entries or an allowlist
# differ from what Cargo resolves, the deps step prints the entries to add,
# replace or remove, as TOML, with the writer of the `display` feature. The
# standard-library support of the default features is left out.
toml = { version = "=1.2.0", default-features = false, features = ["display", "parse", "serde"] }
# The workflows step uses the event parser on text that is already UTF-8,
# so the input-decoding support of the default feature is left out.
yaml-rust2 = { version = "=0.13.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"

# The same rules as the product workspaces: code outside tests never
# unwraps, panics or leaves a placeholder, and an `#[allow]` states its
# reason.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
allow_attributes_without_reason = "deny"
